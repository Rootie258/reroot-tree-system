<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:ROOT – Tree System</title>
    <!-- Nhúng font chữ và các thư viện cần thiết -->
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Mulish', sans-serif; background-color: #E5D7C4; color: #2E2A26; margin: 0; -webkit-font-smoothing: antialiased; }
        .serif { font-family: 'Lora', serif; }
        .transition-stage { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .dot-pause { color: #889063; font-weight: 600; padding: 0 4px; }
        .active-dot { width: 40px; background-color: #354024 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8 md:p-16 overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-6xl mb-12 relative z-20">
        <div class="flex justify-between items-baseline border-b border-stone-300/40 pb-6">
            <div class="serif text-2xl tracking-tight flex items-center gap-3">
                <span class="font-medium">RE:ROOT</span>
                <span class="text-sm opacity-40 italic">Co-Creation Garden</span>
            </div>
            <div class="text-[10px] uppercase tracking-[0.4em] opacity-40 font-semibold">Root to Rise</div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="w-full max-w-6xl mb-20 relative z-30">
        <div class="flex items-center justify-between">
            <button onclick="prevStage()" id="prevBtn" class="p-2 transition-all hover:-translate-x-1"><i data-lucide="arrow-left" size="20"></i></button>
            <div id="nav-dots" class="flex gap-4 md:gap-6 items-center">
                <!-- Dots generated by JS -->
            </div>
            <button onclick="nextStage()" id="nextBtn" class="p-2 transition-all hover:translate-x-1"><i data-lucide="arrow-right" size="20"></i></button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="w-full max-w-6xl grid md:grid-cols-[1.4fr_0.6fr] gap-20 items-start flex-grow relative z-20">
        <div id="content-area" class="transition-stage">
            <div class="mb-12">
                <div id="stage-subtitle" class="serif text-lg italic opacity-40 mb-4 flex items-center gap-4">
                    <div class="w-12 h-[1px] bg-[#CFBB99]"></div>
                </div>
                <h2 id="stage-title" class="serif text-5xl md:text-8xl font-light leading-tight text-stone-900"></h2>
            </div>

            <div class="max-w-xl space-y-12">
                <p id="stage-status" class="text-2xl md:text-3xl font-light italic leading-relaxed opacity-90 border-l border-stone-300 pl-10 py-2"></p>
                <div class="space-y-10 text-lg opacity-80 leading-loose font-light">
                    <p id="stage-desc"></p>
                    <div class="pt-10 border-t border-stone-200/60">
                        <span class="text-[10px] uppercase tracking-[0.3em] font-bold opacity-30">Chiến lược gốc :</span>
                        <div id="stage-expert" class="text-xl font-medium tracking-tight text-[#354024]"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visual Side -->
        <div class="sticky top-20 flex flex-col items-center">
            <div class="relative w-full aspect-square flex items-center justify-center">
                <div id="ambient-light" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="w-3/4 h-3/4 rounded-full blur-[120px] opacity-20 transition-all duration-1000"></div>
                </div>
                <div id="icon-wrapper" class="transition-stage transform text-[#354024]">
                    <!-- Icon generated by JS -->
                </div>
            </div>
            <!-- Root Strength -->
            <div class="w-full mt-16 px-10 py-8 bg-[#E9DCC9]/40 backdrop-blur-sm border border-stone-200/20 rounded-sm">
                <div class="text-[9px] uppercase tracking-[0.3em] font-bold mb-6 opacity-30 flex items-center gap-3">
                    <div class="w-1 h-1 rounded-full bg-stone-400"></div> Năng lực bám rễ
                </div>
                <div id="root-bar" class="flex items-end gap-[2px] h-10 mb-2"></div>
                <div class="serif text-[11px] italic opacity-40 text-right mt-4 tracking-wider">Tĩnh lặng có chiều sâu : Sống đúng căn nguyên.</div>
            </div>
        </div>
    </main>

    <script>
        const STAGES = [
            { title: "Chuẩn bị", subtitle: "Nền đất", status: "Bạn có thôi thúc muốn làm riêng nhưng chưa biết bán gì cụ thể.", desc: "Đây là lúc tích lũy 'dinh dưỡng' từ sách vở : khóa học và trăn trở về giá trị sống.", expert: "Self-Discovery : Xác định giá trị cốt lõi.", icon: "nut", color: "#CFBB99", power: 10 },
            { title: "Chọn giống", subtitle: "Hạt giống tâm hồn", status: "Đứng trước quá nhiều ý tưởng và phải chọn một.", desc: "Hạt giống là sự giao thoa giữa thế mạnh bản thân và nhu cầu thế giới.", expert: "Market-Founder Fit : Tìm điểm chạm Ikigai.", icon: "nut", color: "#889063", power: 20 },
            { title: "Gieo hạt", subtitle: "Hành động đức tin", status: "Bắt đầu gửi đi những bài đăng đầu tiên.", desc: "Giai đoạn của niềm tin khi chưa có phản hồi.", expert: "Market Entry : Xây dựng sự hiện diện.", icon: "circle-dot", color: "#CFBB99", power: 30 },
            { title: "Ươm mầm", subtitle: "Vùng tối Solo-preneur", status: "Làm việc cật lực : thu nhập chưa ổn định.", desc: "Giai đoạn thử sai : rễ đang âm thầm bám sâu.", expert: "MVP Testing : Tập trung vào phản hồi.", icon: "droplets", color: "#889063", power: 45 },
            { title: "Nảy mầm", subtitle: "Khoảnh khắc Eureka", status: "Có đơn hàng đầu tiên từ người lạ.", desc: "Tín hiệu chứng minh mô hình có giá trị thực.", expert: "Product-Market Fit : Công thức giá trị.", icon: "sprout", color: "#889063", power: 55 },
            { title: "Cây trưởng thành", subtitle: "Định hình bản sắc", status: "Thương hiệu cá nhân có chỗ đứng vững chắc.", desc: "Có sự tách biệt giữa chủ và thương hiệu.", expert: "Positioning : Tập trung vào chiến lược.", icon: "trees", color: "#354024", power: 80 }
        ];

        let current = 0;

        function updateUI() {
            const stage = STAGES[current];
            const content = document.getElementById('content-area');
            content.style.opacity = 0;
            
            setTimeout(() => {
                document.getElementById('stage-title').innerHTML = stage.title + '<span style="color: #889063">:</span>';
                document.getElementById('stage-subtitle').innerHTML = '<div class="w-12 h-[1px] bg-[#CFBB99]"></div>' + stage.subtitle;
                document.getElementById('stage-status').innerText = stage.status;
                document.getElementById('stage-desc').innerText = stage.desc;
                document.getElementById('stage-expert').innerText = stage.expert;
                document.getElementById('ambient-light').firstElementChild.style.backgroundColor = stage.color;
                
                // Update Icon
                const iconWrap = document.getElementById('icon-wrapper');
                iconWrap.innerHTML = `<i data-lucide="${stage.icon}" size="100" stroke-width="0.5"></i>`;
                
                // Update Root Bar
                const rootBar = document.getElementById('root-bar');
                rootBar.innerHTML = '';
                for(let i=0; i<20; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'flex-1 transition-all duration-1000';
                    bar.style.height = (10 + Math.random() * 90) + '%';
                    bar.style.backgroundColor = (i/20 < stage.power/100) ? '#889063' : '#CFBB99';
                    bar.style.opacity = (i/20 < stage.power/100) ? 0.8 : 0.1;
                    rootBar.appendChild(bar);
                }

                // Update Dots
                renderDots();
                
                lucide.createIcons();
                content.style.opacity = 1;
            }, 300);

            document.getElementById('prevBtn').style.opacity = current === 0 ? 0 : 1;
            document.getElementById('nextBtn').style.opacity = current === STAGES.length - 1 ? 0 : 1;
        }

        function renderDots() {
            const container = document.getElementById('nav-dots');
            container.innerHTML = '';
            STAGES.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `h-[2px] transition-all duration-700 ${i === current ? 'active-dot' : 'w-2 bg-[#CFBB99]'}`;
                container.appendChild(dot);
            });
        }

        function nextStage() { if(current < STAGES.length - 1) { current++; updateUI(); } }
        function prevStage() { if(current > 0) { current--; updateUI(); } }

        window.onload = updateUI;
    </script>
</body>
</html>
